<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smiley Lab - outside the game</title>
<style>
  body { margin: 0; min-height: 100vh; background: #1e1e2e; color: white; font-family: "Courier New", monospace; display: flex; flex-direction: column; align-items: center; padding: 24px; }
  h1 { margin: 0 0 4px; } p { color: #aaa; font-size: 13px; }
  #stage { position: relative; height: 220px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  #labSmiley { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff9c2, #ffd21f 55%, #f59e00); border: 4px solid #222; position: relative; }
  #labSmiley .e { position: absolute; top: 24px; width: 16px; height: 22px; background: white; border: 3px solid #222; border-radius: 50%; }
  #labSmiley .e.l { left: 14px; } #labSmiley .e.r { right: 14px; }
  #labSmiley .m { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: 34px; height: 14px; border: 3px solid #222; border-top: none; border-radius: 2px 2px 22px 22px; }
  #labSmiley[data-mood="happy"] .m { height: 22px; background: #7c2d12; border-radius: 8px 8px 16px 16px; border-top: 3px solid #222; }
  #labSmiley[data-mood="sad"] { background: radial-gradient(circle at 35% 30%, #dbeafe, #a9c6f5 60%, #7d9bd6); }
  #labSmiley[data-mood="angry"] { background: radial-gradient(circle at 35% 30%, #ffc9a8, #ff8a5c 55%, #e0521f); }
  #labSmiley.hop { animation: hop .45s ease-in-out 3; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }
  #labBubble { min-height: 24px; margin: 10px; background: white; color: black; border-radius: 10px; padding: 6px 12px; font-size: 14px; }
  .row { margin: 6px; } button { font-family: inherit; padding: 6px 10px; margin: 2px; cursor: pointer; }
  input[type=text] { padding: 6px; width: 200px; font-family: inherit; }
</style>
</head>
<body>
  <h1>🧪 Smiley Lab</h1>
  <p>outside the game — poke him, no consequences</p>
  <p><a href="index.html" style="color:#9be9ff">← leave the test room (back to game)</a></p>
  <div id="stage"><div id="labSmiley" data-mood="normal"><div class="e l"></div><div class="e r"></div><div class="m"></div></div></div>
  <div id="labBubble">Hi! I'm test Smiley!</div>
  <div class="row">
    <button onclick="labMood('happy')">Happy</button>
    <button onclick="labMood('normal')">Normal</button>
    <button onclick="labMood('sad')">Sad</button>
    <button onclick="labMood('angry')">Angry</button>
    <button onclick="labHop()">Wave (hop)</button>
  </div>
  <div class="row">
    <input type=text id="labIn" placeholder="make him say..." />
    <button onclick="labSay()">Say it</button>
  </div>
  <script>
    const s = document.getElementById("labSmiley");
    const b = document.getElementById("labBubble");
    function labMood(m) { s.dataset.mood = m; }
    function labHop() { s.classList.remove("hop"); void s.offsetWidth; s.classList.add("hop"); }
    function labSay() {
      const i = document.getElementById("labIn");
      if (!i || !i.value.trim()) return;
      b.textContent = i.value.trim().slice(0, 90);
      labMood("happy"); labHop();
      i.value = "";
    }
    document.getElementById("labIn").addEventListener("keydown", (e) => { if (e.key === "Enter") labSay(); });
  </script>
</body>
</html>
